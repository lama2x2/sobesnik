[project]
name = "sobesnik-core"
version = "0.1.0"
description = "Предметная область Sobesnik: вопросы, рубрики, оценки, прогресс"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sobesnik_core"]
