# Рубрика v1 (000 §9, 003 §5). Любая правка текста — новая версия: хеш попадает в rubric_version.
# Итог = Σ(вес × балл / 3) × 100; вопрос пройден, если итог и баллы не ниже порогов pass_rule.
pass_rule:
  min_total: 50
  min_scores: {correctness: 2}
criteria:
  - id: correctness
    title: Корректность
    weight: 0.30
    levels:
      0: грубые ошибки
      1: есть существенные ошибки
      2: мелкие неточности
      3: ошибок нет
  - id: completeness
    title: Полнота
    weight: 0.25
    levels:
      0: ключевые пункты не раскрыты
      1: раскрыта меньшая часть ключевых пунктов
      2: раскрыта большая часть ключевых пунктов
      3: раскрыты все ключевые пункты
  - id: depth
    title: Глубина
    weight: 0.20
    levels:
      0: только определение
      1: объяснено «что», без «почему»
      2: объяснены причины и компромиссы
      3: компромиссы, границы применимости, пример из практики
  - id: terminology
    title: Терминология
    weight: 0.15
    levels:
      0: термины неверны или отсутствуют
      1: путаница в терминах
      2: термины в целом точны
      3: термины точны и уместны
  - id: structure
    title: Структура
    weight: 0.10
    levels:
      0: не удаётся понять
      1: сбивчиво
      2: понятно, но с перескоками
      3: "логично: тезис → объяснение → пример"
notes: |
  - Эталон для полноты — ключевые пункты вопроса. Пункт засчитывается, если он прозвучал прямо
    или по смыслу, другими словами.
  - Ключевые пункты — ориентир, а не истина. Корректность оценивается по существу. Если ключевой
    пункт сам содержит фактическую ошибку, за его отсутствие балл не снижается.
  - Ответ устный. Слова-паразиты, самоисправления, повторы и огрехи распознавания речи не влияют
    на структуру и терминологию, если смысл восстанавливается.
  - Пустой ответ, «не знаю» или ответ не на тот вопрос — по всем критериям 0.
