      - {slug: devops.kubernetes, title: "Kubernetes"}
      - {slug: devops.cicd, title: "CI/CD"}
      - {slug: devops.observability, title: "Наблюдаемость: логи, метрики, трейсинг, алерты"}
      - {slug: devops.cloud, title: "Облачные платформы"}
      - {slug: devops.iac, title: "Инфраструктура как код: Terraform, Ansible"}
      - {slug: devops.proxy, title: "Nginx, балансировка нагрузки, прокси"}
      - {slug: devops.git, title: "Git: ветки, слияние, rebase"}
      - {slug: devops.general, title: "DevOps — общее"}

  - slug: testing
    title: Тестирование
    topics:
      - {slug: testing.fundamentals, title: "Виды и уровни тестирования, пирамида тестов"}
      - {slug: testing.test_design, title: "Тест-дизайн: классы эквивалентности, граничные значения"}
      - {slug: testing.unit, title: "Юнит-тесты, моки и фикстуры"}
      - {slug: testing.integration, title: "Интеграционные и end-to-end тесты"}
      - {slug: testing.automation, title: "Автоматизация тестирования UI и API"}
      - {slug: testing.performance, title: "Нагрузочное тестирование"}
      - {slug: testing.general, title: "Тестирование — общее"}

  - slug: security
    title: Безопасность
    topics:
