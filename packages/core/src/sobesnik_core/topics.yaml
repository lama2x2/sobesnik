# Справочник тем (000 §2, 002 §7). Модель выбирает только листовые темы.
# Slug темы неизменен: на него ссылаются требования, вопросы и прогресс.
# Новая тема — просто новая строка; переименование slug — только миграцией.

areas:
  - slug: python
    title: Python
    topics:
      - {slug: python.data_model, title: "Модель данных: объекты, изменяемость, dunder-методы"}
      - {slug: python.collections, title: "Встроенные коллекции и сложность операций"}
      - {slug: python.functions, title: "Функции, замыкания, декораторы"}
      - {slug: python.iterators, title: "Итераторы, генераторы, контекстные менеджеры"}
      - {slug: python.oop, title: "ООП в Python: наследование, MRO, дескрипторы, метаклассы"}
      - {slug: python.asyncio, title: "asyncio и асинхронный код"}
      - {slug: python.concurrency, title: "GIL, потоки и процессы в Python"}
      - {slug: python.typing, title: "Аннотации типов и статическая проверка"}
      - {slug: python.memory, title: "Управление памятью и сборка мусора в CPython"}
      - {slug: python.web_frameworks, title: "Веб-фреймворки Python: Django, FastAPI, Flask"}
      - {slug: python.general, title: "Python — общее"}

  - slug: jvm
    title: Java и JVM
    topics:
      - {slug: jvm.core, title: "Java Core: ООП, equals/hashCode, исключения, generics"}
      - {slug: jvm.collections, title: "Коллекции Java и их устройство"}
      - {slug: jvm.concurrency, title: "Многопоточность в Java: потоки, synchronized, java.util.concurrent"}
      - {slug: jvm.memory, title: "Память JVM и сборка мусора"}
      - {slug: jvm.spring, title: "Spring и Spring Boot"}
      - {slug: jvm.kotlin, title: "Kotlin: null-safety, корутины, особенности языка"}
      - {slug: jvm.general, title: "Java и JVM — общее"}

  - slug: go
    title: Go
    topics:
      - {slug: go.concurrency, title: "Горутины, каналы, пакет sync"}
      - {slug: go.types, title: "Типы Go: структуры, интерфейсы, обработка ошибок"}
      - {slug: go.runtime, title: "Рантайм Go: планировщик, память, GC"}
      - {slug: go.context, title: "context: отмена и дедлайны"}
      - {slug: go.general, title: "Go — общее"}

  - slug: frontend
    title: Фронтенд
    topics:
      - {slug: frontend.js_core, title: "JavaScript: замыкания, this, прототипы, типы"}
      - {slug: frontend.event_loop, title: "Event loop, промисы, async/await"}
      - {slug: frontend.typescript, title: "TypeScript: система типов"}
      - {slug: frontend.react, title: "React: рендеринг, хуки, состояние"}
      - {slug: frontend.frameworks, title: "Vue, Angular и другие фреймворки"}
      - {slug: frontend.state, title: "Управление состоянием приложения"}
      - {slug: frontend.browser, title: "Браузер: DOM, рендеринг, производительность страницы"}
      - {slug: frontend.css, title: "Вёрстка и CSS"}
      - {slug: frontend.general, title: "Фронтенд — общее"}

  - slug: lang
    title: Другие языки
    topics:
      - {slug: lang.csharp, title: "C# и .NET"}
      - {slug: lang.cpp, title: "C и C++"}
      - {slug: lang.php, title: "PHP"}
      - {slug: lang.rust, title: "Rust"}
      - {slug: lang.general, title: "Другие языки программирования"}

  - slug: mobile
    title: Мобильная разработка
    topics:
      - {slug: mobile.ios, title: "iOS: Swift, UIKit и SwiftUI, жизненный цикл"}
      - {slug: mobile.android, title: "Android: компоненты, жизненный цикл, Jetpack"}
      - {slug: mobile.cross, title: "Кроссплатформенная разработка: Flutter, React Native"}
      - {slug: mobile.general, title: "Мобильная разработка — общее"}

  - slug: db
    title: Базы данных
    topics:
