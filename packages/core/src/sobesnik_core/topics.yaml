      - {slug: db.nosql, title: "NoSQL: документные, key-value, колоночные БД"}
      - {slug: db.scaling, title: "Репликация, шардирование, партиционирование"}
      - {slug: db.orm, title: "ORM и работа с БД из кода"}
      - {slug: db.general, title: "Базы данных — общее"}

  - slug: web
    title: Веб и API
    topics:
