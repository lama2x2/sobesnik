      - {slug: arch.microservices, title: "Микросервисы и монолит"}
      - {slug: arch.messaging, title: "Очереди и брокеры сообщений: Kafka, RabbitMQ"}
      - {slug: arch.caching, title: "Кэширование: стратегии, инвалидация, Redis"}
      - {slug: arch.distributed, title: "Распределённые системы: согласованность, CAP, идемпотентность"}
      - {slug: arch.system_design, title: "Проектирование систем и масштабирование"}
      - {slug: arch.general, title: "Архитектура — общее"}

  - slug: devops
    title: DevOps и инфраструктура
    topics:
