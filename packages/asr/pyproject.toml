[project]
name = "sobesnik-asr"
version = "0.1.0"
description = "Распознавание речи и хранилище аудио Sobesnik"
requires-python = ">=3.12,<3.13"
# av 17+ убрал аргумент metadata_errors, на котором падает faster-whisper 1.2
dependencies = ["faster-whisper>=1.1", "av>=14,<17", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sobesnik_asr"]
