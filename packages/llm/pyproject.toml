[project]
name = "sobesnik-llm"
version = "0.1.0"
description = "Слой провайдеров LLM Sobesnik"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sobesnik_llm"]
