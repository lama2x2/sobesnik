[project]
name = "sobesnik-bot"
version = "0.1.0"
description = "Telegram-бот Sobesnik: тонкий клиент API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.15",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sobesnik_bot"]
