[project]
name = "sobesnik-api"
version = "0.1.0"
description = "HTTP API Sobesnik"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sobesnik-core",
    "sobesnik-llm",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
sobesnik-core = { workspace = true }
sobesnik-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sobesnik_api"]
