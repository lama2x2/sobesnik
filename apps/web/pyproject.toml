[project]
name = "sobesnik-web"
version = "0.1.0"
description = "Веб-кабинет Sobesnik: тонкий клиент API на Jinja + HTMX"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sobesnik_web"]
