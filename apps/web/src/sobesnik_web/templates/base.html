<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sobesnik{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ ASSET_V }}">
  <script src="/static/htmx.min.js?v={{ ASSET_V }}" defer></script>
  <script src="/static/app.js?v={{ ASSET_V }}" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Sobesnik</a>
    {% if me %}
    <nav>
      <a href="/">Главная</a>
      <a href="/progress">Прогресс</a>
      <a href="/data">Мои данные</a>
    </nav>
    {% endif %}
  </header>
  <main>
    <div id="flash" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
