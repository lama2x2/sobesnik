name: sobesnik

x-app: &app
  env_file:
    - path: .env
      required: false
  extra_hosts:
    # На Mac имя есть и так; на Linux его нужно пробросить явно.
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    s3:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sobesnik
      POSTGRES_PASSWORD: sobesnik
      POSTGRES_DB: sobesnik
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sobesnik -d sobesnik"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Очередь arq, события статуса ответа и состояние бота.
  # 7.2 — последняя ветка Redis под BSD-лицензией.
  redis:
    image: redis:7.2-alpine
    # AOF и том: состояние бота и непрочитанные события переживают перезапуск (006 §7.3)
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-совместимое хранилище аудио (004 §6). Образы MinIO больше не публикуются, поэтому RustFS
  # (Apache-2.0, совместим с API MinIO). Код от него не зависит: замена — правка этого блока и S3_*.
  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-sobesnik}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-sobesnik-secret}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *app
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 40

  # Оценка ответов и прогоны. Тот же образ, что у api; миграции накатывает api.
  worker:
    <<: *app
    build:
      context: .
      target: runtime
    command: ["arq", "sobesnik_api.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      # модели whisper: скачиваются при первом распознавании, в образ не попадают
      - asr-models:/models
    restart: unless-stopped

  # Telegram-бот (006): long polling, тонкий клиент API. Без TELEGRAM_BOT_TOKEN выходит с кодом 0.
  bot:
    <<: *app
    build:
      context: .
      target: runtime
    command: ["python", "-m", "sobesnik_bot"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: on-failure

  # Тесты, линтеры, CLI: docker compose run --rm tools uv run pytest
  tools:
    <<: *app
    build:
      context: .
      target: dev
    profiles: ["tools"]
    volumes:
      - .:/app
      - asr-models:/models
      # кэш Hugging Face хоста только для чтения: whisper large-v3 для эталонных расшифровок (005 §12)
      - ${HOME}/.cache/huggingface/hub:/hf:ro
    environment:
      LLM_PROVIDER: fake
      ASR_PROVIDER: fake
      TEST_DATABASE_URL: postgresql+asyncpg://sobesnik:sobesnik@postgres:5432/sobesnik_test

volumes:
  pgdata:
  redisdata:
  s3data:
  asr-models:
