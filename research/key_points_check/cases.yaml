# Набор для замера проверки пунктов эталона (011 §6.4). Написан вручную, как «лестница» спринта 5:
# у каждого вопроса 4 верных пункта и одна подложенная ошибка — пункт `wrong.n` заменяется на `wrong.text`.
# Виды ошибок: противоположное утверждение, неверное число или порядок, перепутанные понятия.
cases:
  - topic: db.indexes
    question: Почему составной индекс (a, b) не помогает запросу с условием только по b?
    points:
      - B-tree индекс упорядочен сначала по a, а внутри одинаковых a — по b
      - Без условия по a значения b разбросаны по всему индексу
      - Планировщик скорее выберет последовательное чтение таблицы
      - Для поиска по b нужен отдельный индекс по b или индекс (b, a)
    wrong:
      n: 1
      kind: перепутан порядок
      text: B-tree индекс упорядочен сначала по b, а внутри одинаковых b — по a

  - topic: python.asyncio
    question: Что произойдёт, если внутри корутины asyncio вызвать time.sleep(5)?
    points:
      - time.sleep блокирует поток, в котором работает цикл событий
      - Остальные корутины не выполняются эти 5 секунд
      - Вместо него нужно await asyncio.sleep(5)
      - Блокирующий код можно вынести в поток через asyncio.to_thread
    wrong:
      n: 2
      kind: противоположное
      text: Остальные корутины продолжают выполняться, пока эта спит

  - topic: python.general
    question: Почему потоки в CPython не ускоряют вычисления, нагружающие процессор?
    points:
      - GIL позволяет выполнять байткод Python только одному потоку одновременно
      - Для задач ввода-вывода потоки полезны — GIL отпускается на время ожидания
      - Для вычислений используют multiprocessing или процессы
      - Расширения на C могут отпускать GIL и считать параллельно
    wrong:
      n: 1
      kind: противоположное
      text: GIL позволяет потокам Python выполнять байткод параллельно на разных ядрах

  - topic: db.transactions
    question: Чем отличаются уровни изоляции READ COMMITTED и REPEATABLE READ в PostgreSQL?
    points:
      - В READ COMMITTED каждый запрос видит данные, зафиксированные до его начала
      - В REPEATABLE READ вся транзакция видит снимок на момент первого запроса
      - В READ COMMITTED возможно неповторяющееся чтение
      - В REPEATABLE READ конфликт записи приводит к ошибке сериализации и повтору транзакции
    wrong:
      n: 3
      kind: перепутаны понятия
      text: В READ COMMITTED возможно грязное чтение незафиксированных данных

  - topic: web.general
    question: Как гарантировать, что платёж не спишется дважды при повторе запроса?
    points:
      - Клиент передаёт ключ идемпотентности с каждым запросом
      - Сервер сохраняет результат по ключу и на повтор отдаёт тот же результат
      - Проверка ключа и запись платежа — в одной транзакции или с уникальным ограничением
      - Ключ хранится ограниченное время
    wrong:
      n: 2
      kind: противоположное
      text: Сервер на повтор с тем же ключом выполняет списание заново, чтобы данные были свежими

  - topic: web.http
    question: Чем отличаются методы PUT и POST в HTTP с точки зрения идемпотентности?
    points:
      - PUT идемпотентен — повтор того же запроса даёт то же состояние
      - POST не идемпотентен — повтор может создать второй ресурс
      - PUT заменяет ресурс по известному адресу
      - POST обычно создаёт ресурс, адрес которого назначает сервер
    wrong:
      n: 1
      kind: противоположное
      text: PUT не идемпотентен, а POST идемпотентен

  - topic: devops.docker
    question: Зачем в Dockerfile копировать файл зависимостей и ставить их до копирования кода?
    points:
      - Каждая инструкция Dockerfile создаёт слой, слои кэшируются
      - Слой пересобирается, если изменились его входные файлы, и все слои после него тоже
      - Код меняется чаще зависимостей
      - Так при изменении кода установка зависимостей берётся из кэша
    wrong:
      n: 2
      kind: противоположное
      text: Изменение одного слоя не влияет на слои после него — они всегда берутся из кэша

  - topic: devops.git
    question: Чем git rebase отличается от git merge при обновлении ветки из main?
    points:
      - merge создаёт коммит слияния и сохраняет историю как есть
      - rebase переносит коммиты ветки поверх main, создавая новые коммиты
      - После rebase опубликованной ветки нужен force-push
      - rebase даёт линейную историю
    wrong:
      n: 2
      kind: перепутаны понятия
      text: rebase переносит коммиты ветки поверх main, сохраняя их хеши

  - topic: testing.unit
    question: Как в pytest работает область действия фикстуры scope="session"?
    points:
      - Фикстура создаётся один раз на весь запуск тестов
      - Все тесты получают один и тот же объект
      - Подходит для дорогих ресурсов, например подключения к базе
      - Код после yield выполняется один раз в конце запуска
    wrong:
      n: 1
      kind: неверная частота
      text: Фикстура создаётся заново перед каждым тестом

  - topic: arch.messaging
    question: Как Kafka сохраняет порядок сообщений?
    points:
      - Порядок гарантируется только внутри одной партиции
      - Сообщения с одинаковым ключом попадают в одну партицию
      - Внутри группы консьюмеров партицию читает один консьюмер
      - Между партициями порядок не гарантируется
    wrong:
      n: 4
      kind: противоположное
      text: Порядок гарантируется и между разными партициями одного топика
